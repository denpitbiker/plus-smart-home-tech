server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: products
          uri: lb://product-service
          predicates:
            - Path=/products,/products/**
          filters:
            - PrefixPath=/api
            - name: Retry
              args:
                retries: 3
                statuses: NOT_FOUND
                series: []
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
        - id: categories
          uri: lb://product-service
          predicates:
            - Path=/categories,/categories/**
          filters:
            - PrefixPath=/api
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/inventory,/inventory/**
          filters:
            - PrefixPath=/api
        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/orders,/orders/**
          filters:
            - PrefixPath=/api
