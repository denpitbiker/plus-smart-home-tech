# Тестовая конфигурация: H2 вместо PostgreSQL.
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 200
            readTimeout: 300
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:order_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

context:
  initializer:
    classes: ru.yandex.practicum.order.OrderDependenciesInitializer

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 1s
