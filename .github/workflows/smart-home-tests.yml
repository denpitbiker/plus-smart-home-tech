# Based on yandex-praktikum/plus-smart-home-tech, branch ci.
name: Smart Home Tech Tests

on:
  workflow_call:
    inputs:
      verbose_mode:
        required: false
        type: string
        default: "false"
      print_logs:
        required: false
        type: string
        default: "false"

env:
  VERBOSE_MODE: ${{ inputs.verbose_mode }}
  PRINT_LOGS: ${{ inputs.print_logs }}
  LOG_DIR: ./logs
  STUFF_REPO: "https://github.com/yandex-praktikum/plus-smart-home-tech.git"
  STUFF_BRANCH: "ci"
  STUFF_PATH: .github/workflows/stuff
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_PORT: 5432

jobs:
  check-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout workflow stuff
        run: |
          # Создаем временную папку
          mkdir -p temp_checkout
          cd temp_checkout

          # Инициализируем git и настраиваем sparse-checkout
          git init
          git remote add origin "$STUFF_REPO"
          git config core.sparseCheckout true
          echo "$STUFF_PATH/*" >> .git/info/sparse-checkout

          # Клонируем только нужную папку
          git pull --depth=1 origin "$STUFF_BRANCH"
          
          mkdir -p "../${STUFF_PATH}"
          
          # Перемещаем файлы в папку stuff
          mv "${STUFF_PATH}"/* "../${STUFF_PATH}/"
          
          ls -la "../${STUFF_PATH}"
          
          # Выходим из временной папки и удаляем её
          cd ..
          rm -rf temp_checkout
          # Даём разрешения на выполнение скриптов
          chmod +x ${STUFF_PATH}/scripts/*.sh

      - name: Check repo not fork and public
        run: ${STUFF_PATH}/scripts/check-repo.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check branch name
        run: ${STUFF_PATH}/scripts/check-branch.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check files
        run: ${STUFF_PATH}/scripts/check-files.sh
        env:
          PULL_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}

  build-and-test:
    needs: check-repo
    if: always() && needs.check-repo.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Оптимизируем скорость

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Checkout workflow stuff
        run: |
          # Создаем временную папку
          mkdir -p temp_checkout
          cd temp_checkout

          # Инициализируем git и настраиваем sparse-checkout
          git init
          git remote add origin "$STUFF_REPO"
          git config core.sparseCheckout true
          echo "$STUFF_PATH/*" >> .git/info/sparse-checkout
          
          # Клонируем только нужную папку с аутентификацией
          git pull --depth=1 "https://x-access-token:${GH_TOKEN}@${STUFF_REPO#https://}" "$STUFF_BRANCH"
          
          mkdir -p "../${STUFF_PATH}"

          # Перемещаем файлы в папку stuff
          mv "${STUFF_PATH}"/* "../${STUFF_PATH}/"

          ls -la "../${STUFF_PATH}"

          # Выходим из временной папки и удаляем её
          cd ..
          rm -rf temp_checkout
          # Даём разрешения на выполнение скриптов
          chmod +x ${STUFF_PATH}/scripts/*.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check and Build application
        run: |
          mvn clean install -DskipTests --no-transfer-progress

      # Для веток заданий этап равен имени ветки, а для интеграционных веток develop
      # и development он определяется по коду решения: учитываются только реально
      # реализованные модули, заготовки из precode этапом не считаются.
      # Результат кладём в BRANCH_NAME, его используют все скрипты ниже.
      - name: Detect solution stage
        id: stage
        run: |
          STAGE=$(${STUFF_PATH}/scripts/detect-stage.sh)
          echo "✅ Определён этап решения: $STAGE"
          echo "BRANCH_NAME=${STAGE}" >> $GITHUB_ENV
          echo "stage=${STAGE}" >> $GITHUB_OUTPUT

          # Этапы, на которых в проекте уже должен быть Spring Cloud Config Server
          case "$STAGE" in
            5-config-server|6-discovery-server|7-*|8-*|9-*|10-*|11-*) CONFIG_STAGE=true ;;
            *) CONFIG_STAGE=false ;;
          esac
          echo "CONFIG_STAGE=${CONFIG_STAGE}" >> $GITHUB_ENV

      - name: Configure temporary Gateway passwords
        run: |
          for variable in SECURITY_IVAN_PASSWORD SECURITY_ANNA_PASSWORD; do
            password=$(openssl rand -hex 24)
            echo "::add-mask::$password"
            echo "$variable=$password" >> "$GITHUB_ENV"
          done

      - name: Test Gateway security and routing
        run: mvn -pl infra/api-gateway -am test --no-transfer-progress

      - name: Start infrastructure
        run: ${STUFF_PATH}/scripts/start-infra.sh

      - name: Check Config Server module and services configuration
        if: env.CONFIG_STAGE == 'true'
        run: ${STUFF_PATH}/scripts/check-config-server.sh static

      - name: Check Circuit Breaker implementation
        if: contains(fromJson('["9-circuit-breaker", "10-gateway-load-balancing", "11-security"]'), env.BRANCH_NAME)
        run: ${STUFF_PATH}/scripts/check-circuit-breaker.sh

      # Маршруты и схема lb:// проверяются по исходникам до запуска стенда:
      # если балансировки нет в конфигурации, тесты этапа всё равно не пройдут.
      - name: Check Gateway configuration
        if: contains(fromJson('["10-gateway-load-balancing", "11-security"]'), env.BRANCH_NAME)
        run: ${STUFF_PATH}/scripts/check-gateway.sh

      - name: Verify JAR files and Start Telemetry Services
        if: contains(fromJson('["1-collector-json", "2-collector-grpc", "3-aggregator", "4-analyzer", "develop"]'), env.BRANCH_NAME)
        run: ${STUFF_PATH}/scripts/start-telemetry.sh

      - name: Test Telemetry Services
        id: test
        if: contains(fromJson('["1-collector-json", "2-collector-grpc", "3-aggregator", "4-analyzer", "develop"]'), env.BRANCH_NAME)
        run: ${STUFF_PATH}/scripts/run-tests.sh
        continue-on-error: false

      - name: Verify JAR files and Start Services
        if: env.CONFIG_STAGE == 'true'
        run: ${STUFF_PATH}/scripts/start-services.sh

      - name: Check Config Server serves configuration for every service
        if: env.CONFIG_STAGE == 'true'
        run: ${STUFF_PATH}/scripts/check-config-server.sh runtime

      - name: Check services use configuration from Config Server
        if: env.CONFIG_STAGE == 'true'
        run: ${STUFF_PATH}/scripts/check-config-clients.sh

      - name: Install Node
        if: contains(fromJson('["7-spring-cloud-microservices", "7-microservices", "8-open-feign", "9-circuit-breaker", "10-gateway-load-balancing"]'), env.BRANCH_NAME)
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'

      - name: Install newman
        if: contains(fromJson('["7-spring-cloud-microservices", "7-microservices", "8-open-feign", "9-circuit-breaker", "10-gateway-load-balancing"]'), env.BRANCH_NAME)
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run POSTMAN tests
        if: contains(fromJson('["7-spring-cloud-microservices", "7-microservices", "8-open-feign"]'), env.BRANCH_NAME)
        run: ${STUFF_PATH}/scripts/run-postman-tests.sh

      # На этапе Circuit Breaker базовая коллекция запускается внутри сценария:
      # он дополнительно гасит зависимости и проверяет деградацию и восстановление.
      - name: Run Circuit Breaker tests
        if: env.BRANCH_NAME == '9-circuit-breaker'
        run: ${STUFF_PATH}/scripts/run-circuit-breaker-tests.sh

      # На этапе Gateway базовая коллекция тоже запускается внутри сценария:
      # все запросы идут через gateway, а сам сценарий дополнительно поднимает
      # второй экземпляр сервиса и проверяет распределение нагрузки и отказ экземпляра.
      - name: Run Gateway and Load Balancing tests
        if: env.BRANCH_NAME == '10-gateway-load-balancing'
        run: ${STUFF_PATH}/scripts/run-gateway-tests.sh

      - name: Capture Exit Status
        if: always()
        run: echo "STATUS=${{ steps.test.outcome }}" >> $GITHUB_ENV

      - name: Compose down
        if: always()
        run: ${STUFF_PATH}/scripts/stop-infra.sh

      - name: Upload execution log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-execution-report
          path: |
            execution-report.txt
            ./logs/*.log
            ./logs/access/*.log
            ./reports/*.html

      - name: Fail if Tests Failed
        if: env.STATUS != 'success' && env.STATUS != 'skipped'
        run: |
          echo "❌ Тесты завершились с ошибками!"
          exit 1